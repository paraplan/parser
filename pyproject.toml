[project]
name = "parser"
version = "0.1.0"
description = "VGPK schema parser"
authors = [
    { name = "VodoGamer", email = "vodogamer@yandex.ru" }
]
dependencies = [
    "pydantic>=2.7.1",
    "orjson>=3.10.3",
]
readme = "README.md"
requires-python = ">= 3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/parser"]
