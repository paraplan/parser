[project]
name = "parser"
version = "0.1.0"
description = "VGPK schema parser"
authors = [{ name = "VodoGamer", email = "vodogamer@yandex.ru" }]
dependencies = [
    "pydantic>=2.7.1",
    "orjson>=3.10.3",
    "fastapi>=0.111.0",
    "uvicorn>=0.29.0",
    "aiohttp>=3.9.5",
    "python-dotenv>=1.0.1",
]
readme = "README.md"
requires-python = ">= 3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = ["pyright>=1.1.362", "ruff>=0.4.3", "pre-commit>=3.7.0"]

[tool.ruff]
lint.select = ["I", "E", "F", "B", "Q"]
line-length = 99

[tool.pyright]
include = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/parser"]
