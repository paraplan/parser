[tool.poetry]
name = "vgpk-parser"
version = "0.1.0"
description = ""
license = "MIT"
authors = ["VodoGamer <vodogamer@yandex.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
python-dotenv = "^1.0.1"
pydantic = "^2.6.2"
orjson = "^3.9.15"

[tool.poetry.group.dev.dependencies]
black = "^24.1.1"
ruff = "^0.1.14"

[tool.ruff]
lint.select = ["I", "E", "F", "B", "Q"]
exclude = ["venv", "migrations"]
line-length = 99
target-version = "py311"

[tool.black]
line-length = 99
target-version = ['py311']

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
